  Global Atlas bands and colours, so the 13 are drawn in a separate bottom band.

  Because adopting any option reverses a convention documented on 2026-09-20,
  I did not change any entity or the vocabulary. C5 moved to unresolved.md row
  228 with three options (retire, apply everywhere, narrow) and a
  recommendation to retire. Counts: candidates open 0, unresolved rows 68.
