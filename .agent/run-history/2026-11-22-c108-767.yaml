summary: >
  Roadmap #767, a twelfth slice: the Convention 108 edges for Argentina and Uruguay (on INTL-CONVENTION-108 and on
  the two country anchors) now open with each country's own approval law, read directly: Argentina's Ley 27.483
  (sanctioned 6 December 2018, Boletín Oficial 2 January 2019, on InfoLEG) and Uruguay's Ley 19.030 (promulgated 27
  December 2012, published 7 January 2013, on IMPO), both approving the Convention and its 2001 Additional
  Protocol. The deposit of the instruments with the Council of Europe, which is what makes each a Party, is still
  read only through the encyclopedia (coe.int is blocked), and the evidence says so. Mexico's Diario Oficial failed
  certificate verification (hostname mismatch) and was not read. Closes the run-history entry for #819.
