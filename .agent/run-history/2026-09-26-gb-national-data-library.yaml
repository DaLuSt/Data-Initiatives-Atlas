  GBP100m component of the government's 50-point AI Opportunities Action
  Plan (early 2025), with its own Expert Advisory Group (Sept 2025),
  a completed discovery phase (Jan 2026) and five pilot projects.
  Sourced from Computer Weekly's reporting and DSIT's own public-
  attitudes research summary on GOV.UK, both read directly. Recorded
  related-to (not a rename) between the new programme and the existing
  portal, since no source states they are organisationally the same.
