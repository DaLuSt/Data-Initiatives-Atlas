summary: >
  The owner created the LinkedIn developer app (with the Atlas logo) and asked for
  the authorisation script to be built now instead of in 2027.01. Added
  tools/linkedin_auth.py: standard library only; opens the consent URL with a random
  state, receives the redirect on 127.0.0.1 only and refuses a state that does not
  match, exchanges the code, reads the member ID from the OpenID userinfo endpoint,
  prints LINKEDIN_ACCESS_TOKEN, LINKEDIN_AUTHOR_URN and LINKEDIN_TOKEN_EXPIRES for
  the owner to paste into the GitHub environment `linkedin`, writes nothing to disk,
  and never prints or accepts on the command line the Client Secret. The endpoints and
  the form fields were checked against LinkedIn's authorization-code-flow and
  Sign In with LinkedIn (OpenID Connect) pages on Microsoft Learn on 2026-10-09.
  tools/test_linkedin_auth.py has 38 tests (pure functions, the real local receiver
  on an ephemeral port, the flow against fakes, source-level safety checks); six
  deliberate breakages of the script (state check removed, bind to all interfaces,
  scope dropped, secret printed, a file written, output not escaped) were each caught
  by a test. It is in the shared checks action. docs/credentials.md has the run
  instructions. Not verified: a real run against LinkedIn, which only the owner can do.
  The owner then found that creating the app needs a LinkedIn Page and has no company. LinkedIn's
  help pages (read 2026-10-09) say an individual developer must associate a default Page, that a
  Page is free and needs only a LinkedIn account, and that the app-to-Page link is permanent;
  docs/credentials.md now has the steps for creating a Page for the project.
  Still to build for #515 (2027.01): tools/linkedin_post.py and the approval-gated
  workflow job.
