summary: >
  Owner asked to continue with point 1 of the usability review (the first
  screen is a hairball with no introduction), in English. Added a "Start here"
  card over the graph on a bare address: what the picture is, with live counts
  from graph.json, and five ways in as ordinary links to hashes the app already
