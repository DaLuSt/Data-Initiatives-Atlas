  (country=DE) inherited the filter. The examples therefore all name their view
  explicitly (#view=explorer&focus=...), and the code comment says why.

  Verified in the browser at desktop and mobile size (first visit, each example,
  Esc, reopen, focus, deep link shows no card, no console errors) with
  screenshots. New TestStartHere (3 tests): every example names its view, every
  entity named exists, every promised chain is a real path of typed
  relationships; checked by pointing one example at a missing entity.
