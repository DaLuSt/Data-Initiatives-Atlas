summary: >
  Roadmap #544 (Northern America). The USMCA from USTR's own site: the agreement (INTL-USMCA, in force 1 July 2020,
  `applies-in` US, MX, CA), Chapter 19 on digital trade (INTL-USMCA-CH19: personal information protection, cross-border
  transfers, computing facilities, cybersecurity, open government data) and the Free Trade Commission
  (INTL-USMCA-FTC). No region anchor: one bloc instrument and no body of its own. The 1 July 2026 joint review outcome
  is only in secondary pages (and USTR's October notice speaks of a "2027 joint review"), so it is not modelled; row #254.
