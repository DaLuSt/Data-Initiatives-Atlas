summary: >
  Roadmap #450, third step ("all in alphabetical order"): seven thin domains (chemicals, food, manufacturing,
  postal, research, space, water) deepened in one move, because the national NIS2 acts list exactly these sectors
  in their annexes. The annexes were read directly: DE-BSIG Anlagen 1 and 2 (gesetze-im-internet.de, BGBl. 2025 I
  Nr. 301), BE-NIS2-WET Bijlagen I and II (Justel) and LU-LOI-NIS2 Annexes I and II (Memorial A n. 225). Each
  entity gained the domain tags the annexes support and a section listing the sectors, as NL-CBW already had.
  Result: those seven domains now cover 4 to 5 countries (BE, DE, LU, NL, plus GB for water). Thin domains 10 -> 3
  (education 2, built environment 1, social security 1). Not read: the Polish and French NIS2 acts.
