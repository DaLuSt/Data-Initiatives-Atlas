summary: >
  Roadmap #481, #482 and #483 (country groups 12 to 14), one country each. Brazil: the National Data Protection Agency's
  own pages, which quote the LGPD (Law 13.709 of 2018), the Digital Statute of Children and Adolescents (Law 15.211 of
  2025) and Law 15.352 of 2026 turning the Agency into a regulatory agency. Japan: the Personal Information Protection
  Commission and the Digital Agency (English sites), the APPI, the My Number Act and the January 2026 triennial-review
  reform policy (the outline read; whether the amendment bill passed is unread). Malaysia: the Personal Data Protection
  Department's home page and the PDPA 2010 (Act 709). The United States (#482) too, from enrolled public laws on govinfo.gov (the Evidence Act of 2018,
  which holds the OPEN Government Data Act, and the E-Government Act of 2002, whose Title V the Evidence Act repealed) and
  Data.gov's page. Rows #249 to #251 added; 23 countries of those groups not added (sites not answering, 403, or not
  tried). Anchors now 105; 90 of 193 UN members have none.
