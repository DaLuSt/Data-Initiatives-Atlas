summary: >
  Owner asked to start a roadmap, version control and tracking of feature
  releases, automatically. Answers to three design questions: two version
  tracks (schema SemVer + dated data release), an automatic release pull request
  that the owner merges, and the roadmap as GitHub Issues with a Project board.

  Added: schema_version 1.0.0 and optional_fields in metadata/schema.json (a
  test fails if the repository uses a frontmatter field the schema does not
  list, so an added field cannot slip past the version rule);
  metadata/versioning.md (policy, bump rules, the schema history before
  versioning with the bump each change would have been); CHANGELOG.md with
  markers; tools/release.py (plan, prepare, notes, tags, check-schema) and
  tools/test_release.py (39 tests, including a throw-away git repository);
  a CI step that fails a schema change without a version bump; release-pr.yml
  (weekly or on demand: prepares version.yaml, CHANGELOG entry and state.yaml,
  validates, opens the pull request) and release-publish.yml (on merge of
  version.yaml to main: tags data-YYYY.MM.N and schema-X.Y.Z, creates the
  GitHub Release); the release shown in graph.json and the site footer;
  docs/roadmap.md and an issue template; short rules in CONTRIBUTING.md,
  AGENTS.md and the operating model; a README section.

  Checked: the full flow (first release, tag, second release with a feature, a
  data change, a housekeeping change and a closed issue, then a release with
  nothing to release) in a scratch clone; mutations of the version arithmetic and
  the schema rule fail the tests. NOT checked: the two workflows have never run on
  GitHub; they are verified by parsing and by tests of what they call. Two
  repository settings may block them (Actions allowed to create pull requests;
  see the workflow header).

  Mistake made and undone: a command chain in my scratch-clone simulation broke
  before its `cd` (rsync was not installed), so test commits and a data-2026.10.1
  tag were created in the real local repository. Nothing was pushed; I reset the
  branch to origin/main with --soft, removed the test files and the tag, and
  checked the diff contained only the intended changes.
