summary: >
  Roadmap #770 (laws with no body), a sixth slice. New entity IE-INFORMATION-COMMISSIONER, from two statutory
  instruments read directly on irishstatutebook.ie: S.I. No. 133 of 2007, regulation 12 (the office of Commissioner
  for Environmental Information, held by the Information Commissioner, hears appeals), and S.I. No. 376 of 2021,
  regulations 2, 15 and 16 (the Information Commissioner is the "Appeal Commissioner" for re-use appeals). It is
  governed-by both, part-of IE, and listed in countries/ie/index.md; confidence medium because the FOI Act 2014 was
  not read and oic.ie answered 403. The #770 measure goes from 35 to 33. Also GB-DWQR: section 7 of the Water
  Industry (Scotland) Act 2002 is now read (appointment by the Scottish Ministers; no start date, as the role is by
  appointment and the page has no commencement annotation). Tried and left: INTL-CEFTA (entry into force differs by
  party). Closes the run-history entry for #840.
