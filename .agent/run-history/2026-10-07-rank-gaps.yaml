summary: >
  Roadmap issue #449: the residual gaps in the constitutional-rank designations
  (discovery/unresolved.md row #11).

  Portugal: downloaded the English text of the Constitution (constituteproject.org,
  Portugal 1976 rev. 2005) and read Art. 112(3) in the raw page ("laws which under
  this Constitution are compulsory legal prerequisites for other laws or which
  must be obeyed by other laws, shall possess superior force"), then searched the
  text for what the Constitution itself makes such a law: framework laws for the
  Budget (Art. 106), for the regions' use of the tax system and for
  reprivatisations (Art. 293), and the "basic laws" under which decree-laws are
  made (Art. 198, 227). None concerns data protection, access to administrative
  information or cybersecurity, so none of the four Portuguese entities is in the
  category. Recorded in metadata/rank-basis.md as negative evidence from one English
  text, not a legal opinion. United Kingdom: legislation.gov.uk was read
  directly (curl and the fetch tool both work; an earlier note in the repository
  had implied otherwise): the Data Protection Act 2018's
  contents page files it under UK Public General Acts, All Primary Legislation.
  The UK has no written constitution, so that row cannot rest on a constitutional
  text and no further check exists.

  Left open, owner's call: whether `rank` should capture "code versus single
  statute" (IT-CAD). The existing rule already ranks a legislative decree
  ordinary and the entity's body explains that it is a code; recommendation is to
  decline modelling it. Row #11 now says so; roadmap #449 stays open for that
  decision.

  Also found while reading #461's list: the domain-facet-row item is already
  guarded, because validate_relationships.check_id_list errors on a `domains:` id
