  Art. 3 ter role in). None links an organisation, because none of the bodies is an entity. #775: Malaysia's PDPA
  2010 is dated 15 November 2013 from the data protection department's own pages (the Act's text for s. 1(2), and
  its page on the commencement order); the Philippines (privacy.gov.ph, officialgazette.gov.ph: 403), Jamaica
  (oic.gov.jm: JavaScript) and Canada (the consolidated Act gives no commencement date) were tried and are not
  dated. Riigi Teataja's JSON interface was found and recorded in discovery/unresolved.md's source-block table; it
  gives metadata, not text. Records #853 as merged.
