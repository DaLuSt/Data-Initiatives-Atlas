summary: >
  Roadmap #482 and #483, two more countries. China: the Data Security Law (the NPC's English translation read in full;
  adopted 10 June 2021, in effect 1 September 2021) and the Personal Information Protection Law (a Xinhua report on the
  NPC's English site; adopted 20 August 2021, in effect 1 November 2021). No authority is modelled because the law names
  "the national cyberspace affairs department" only by function. Tanzania: the Personal Data Protection Act, 2022 (Act No.
  11 of 2022) in its gazetted Official English Version, read as text from TanzLII (commencement 1 May 2023, GN 326 of
  2023), and the Personal Data Protection Commission it establishes. Rows #250 and #251 updated. Anchors now 107; 88 of 193
  UN members have none.
