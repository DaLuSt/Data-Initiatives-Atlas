summary: >
  Owner asked to close the Germany gap in metadata/rank-basis.md (the Basic Law
  had not loaded on constituteproject.org, so the German row rested on standard
  knowledge). Read the official German text on gesetze-im-internet.de (Federal
  Ministry of Justice; version last amended by Art. 1 of the Act of 22 March
  2025, BGBl. 2025 I Nr. 94) and the official English translation on the same
  site. Art. 79(1)-(2): the Basic Law can be changed only by a statute that
  expressly alters or supplements its wording, with two-thirds majorities in
  Bundestag and Bundesrat, so the higher category is the amending statute.
  Art. 78: when an ordinary federal statute comes into being (Bundesrat consent
  or no objection), which is procedure, not rank. Art. 80(1): a statute may
  authorise ordinances (Rechtsverordnungen), the delegated rung. Searched both
  texts for an organic, cardinal or qualified-majority category of statute: none.
  The 17 German acts stay ordinary; no German act amends the Basic Law.

  This leaves the United Kingdom (no written constitution) as the only row
  resting on standard knowledge, plus two decree/ordinance rank rules that the
  constitutional texts for France and Portugal do not state. unresolved.md row
  11 updated.
