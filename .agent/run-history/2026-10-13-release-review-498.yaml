summary: >
  Roadmap #498 (review the release cadence and changelog after three releases). Checked the three releases
  (2026.10.1, .2, .3) and their changelog entries: weekly pull request with a skip for housekeeping-only weeks, the
  YYYY.MM.N numbering and the separate schema track all work and stay. Two changes. (1) Housekeeping entries
