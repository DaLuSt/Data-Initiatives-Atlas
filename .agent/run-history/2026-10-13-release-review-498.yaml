  prevented it. prepare now records prepared_from and prepared_at in metadata/version.yaml and the next release counts
  from them (tools/release.py since; release-pr.yml uses it); the first run after this falls back to the tag. Decision
  table written in metadata/versioning.md. 3 new tests (72 in tools/test_release.py).
