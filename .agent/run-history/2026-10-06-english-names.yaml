  name is the Atlas's label, not necessarily an official translation; both
  names are searchable. build_graph carries name_en in the light payload.

  New TestEnglishNames (5 tests) and the sidebar-order test updated for the new
  panel; mutations (allow a repeated name, drop applyNames() from boot) each
  fail the tests. Observed, not fixed: changing depth or names in the Explorer
  makes Cytoscape log "edge has invalid endpoints" warnings (38 on a depth
  change; pre-existing, present without name_en). Not tested: how mixed
  English and original labels read to visitors.
