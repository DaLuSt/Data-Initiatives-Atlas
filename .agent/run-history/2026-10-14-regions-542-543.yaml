summary: >
  The owner asked for an hour of roadmap items. Regions #542 (Southern Europe) and #543 (Eastern Europe); #541
  (Northern Europe) stays blocked, norden.org answers 403. Probed the leads' sites first: cefta.int, eaeunion.org and
  eec.eaeunion.org answer a plain request. CEFTA: read Joint Committee Decisions 2/2024 (e-commerce, adopted 9 October
  2024, status adopted because the 2 December 2025 Conclusions still call on the Parties to finish their procedures),
  10/2025 (Working Group on Digital Cooperation, 2 December 2025) and 11/2025 (recognition of advanced electronic
  signatures and seals, 16 December 2025, defined by reference to eIDAS), plus the Conclusions; 6 entities (agreement,
  Joint Committee, working group, three decisions) with applies-in to the seven Parties (Albania, Bosnia and
  Herzegovina, Moldova, Montenegro, North Macedonia, Serbia, Kosovo). Eurasian Economic Union: the Union, its Commission,
  the Treaty (from the Union's own pages only), the Third Major Protocol of 25 May 2023 (trust space extended to B2G)
  and the Commission Board's 22 August 2023 decision on mutual recognition of electronic signatures (from the Commission's
  news item only, text not read); 5 entities, edges to the four Member States that have an anchor (Kazakhstan has none).
  Not modelled: the EAEU Digital Agenda until 2025 (only secondary sources), CEFTA decision 12/2025 (not found on the
  site). Not examined this session: the Union for the Mediterranean, BSEC, the Visegrad Group, the CIS, the Council of the
  Baltic Sea States. Rows #244 and #245 record what is unread; rank-basis.md lists both families as unranked. 11 new
  entities (856 to 867). Browser suite 137/137 with all of them.
