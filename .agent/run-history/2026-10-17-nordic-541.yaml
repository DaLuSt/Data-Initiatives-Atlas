summary: >
  Roadmap #541 (Northern Europe): the blocker in row #230 is lifted. norden.org answers 403, but the Nordic Council of
  Ministers' own publication host serves the PDF of the Nordic-Baltic Co-operation Programme for Digitalisation 2025-2030
  (PolitikNord 2024:754), which was read in full. New entities: the Nordic Council of Ministers, its ministerial council
  for digitalisation (MR-DIGITAL) and the programme (approved 20 September 2024, valid 1 January 2025 to 31 December 2030;
  goals include a common area for cross-border digital services and enhanced cross-border sharing and re-use of data). The
  links to the eight Nordic and Baltic country anchors are low-confidence interpretation, because the programme says
  "the Nordic and the Baltic countries" without listing them. Still unread: Digital North 2.0 (2020) and the November 2025
  Tampere declaration (search summaries only), and the Nordic Council. Row #230 updated.
