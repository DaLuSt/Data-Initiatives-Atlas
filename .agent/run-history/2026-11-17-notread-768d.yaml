summary: >
  Roadmap #768, a fourth slice: 26 more "NOT READ — search-only" edges read directly, from NIS2 (Article 44 repeal of
  NIS1), the Cybersecurity Act (ENISA), the GDPR (Article 68(3) EDPS seat on the EDPB; recital 105 on Convention 108),
  eIDAS 2 (Article 5a), Regulation 1025/2012 (Annex I: CEN, Cenelec, ETSI), Regulation 223/2009, the PSI Directive, the
  Digital Decade Decision (Article 7(1) national roadmaps, ten edges) and the 2020 data strategy (pillar D). Three
  corrections came out of the reading: the Commission's edge to the Digital Omnibus cited COM(2025) 836 (the AI
  omnibus) instead of 837; the EUDI wallet deadline is not "the end of 2026" in the text but 24 months after the
  implementing acts' entry into force (Article 5a(1)), fixed in EU-EIDAS2 and EU-EUDI-WALLET; and the Digital Omnibus's
  own title shows it would also amend the Single Digital Gateway Regulation, Regulation 2018/1725, NIS2 and CER and
  repeal the platform-to-business Regulation, recorded in prose. Belgium's and Germany's part-of EU edges no longer
  claim accession "on 1 January 1958": the EU's list gives the year only.
