# In-flight task tracker. Read alongside .agent/state.yaml at the start
# of every session. `status: idle` means no batch is in progress — pick
# the next item per .agent/operating-model.md's priority order rather
# than waiting to be told what to do.
#
# When starting a multi-step task that might get interrupted (timeout,
# crash), set status to "in_progress" and fill in the fields below in the
# same commit as the first step, so a future session can resume cleanly
# instead of re-discovering what was happening. Set it back to "idle"
# (and clear the fields) once the work is merged.

status: idle

task: null
branch: null
started: null
description: null
next_step: null

notes: >
  Idle. The log of what each session did is one dated file per session in
  .agent/run-history/ (this file used to carry the narrative of the 2026-10-01
  requests; it is now .agent/run-history/2026-10-01-current-task-notes.yaml).
