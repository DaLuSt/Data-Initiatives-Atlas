name: Atlas checks
description: >
  The validation suite and every test suite that needs no network. Used by
  validate.yml (pull requests and pushes) and pages.yml (deploy), so the two
  cannot drift apart. The list of checks lives in tools/check_all.py, which a
  session or a contributor runs the same way; a new test file is added there, once.

# The caller checks the repository out and sets Python up first.
runs:
  using: composite
  steps:
    - name: Install dependencies
      shell: bash
      run: pip install -r validation/requirements.txt

    # Each check is folded under its own title in the log, and failures are annotated.
    - name: Run every check
      shell: bash
      run: python tools/check_all.py
