name: Build and deploy Atlas graph

# Deployment runs only for `main` — pull requests are validated by
# validate.yml and never reach the production GitHub Pages site (brief §17).
on:
  push:
    branches: [main]
    paths:
      # Entity data (the source of truth) …
      - "initiatives/**"
      - "legislation/**"
      - "policies/**"
      - "soft-law/**"
      - "strategies/**"
      - "standards/**"
      - "frameworks/**"
      - "programmes/**"
      - "organisations/**"
      - "data-spaces/**"
      - "platforms/**"
      - "publications/**"
      - "domains/**"
      - "countries/**"
      - "regions/**"
      - "international/**"
      # … the vocabularies that shape it, the generator, and the site itself.
      - "metadata/**"
      - "tools/**"
      - "validation/**"
      - "site/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never run two deployments at once; let a newer commit win.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Validate, generate graph, build site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # A broken repository must never be published. These are the same checks
      # that guard pull requests (one shared definition, .github/actions/checks).
      - uses: ./.github/actions/checks

      - name: Generate the graph
        env:
          ATLAS_BRANCH: ${{ github.event.repository.default_branch }}
        run: python tools/build_graph.py

      # Note: site/graph.json and site/details.json are not committed (they
      # are gitignored), so this step is what produces them. That is safe only
      # because the build is reproducible, which test_build_graph.py asserts
      # (test_build_is_deterministic).

      - name: Report graph statistics
        run: |
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          g = json.load(open("site/graph.json"))
          s = g["stats"]
          print("## Atlas graph\n")
          print(f"Generated: `{g['generated_at']}`\n")
          print("| Metric | Value |")
          print("|---|---|")
          for k in ("entities", "relationships", "associations", "wikilinks",
                    "countries", "regions", "organisations", "legislation",
                    "standards", "frameworks", "data_spaces", "initiatives"):
              print(f"| {k.replace('_', ' ').title()} | {s.get(k, 0):,} |")
          print()
          print("Countries: " + ", ".join(
              f"{c['label']} ({c['code']}, {c['count']})" for c in g["facets"]["countries"]))
          PY

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
