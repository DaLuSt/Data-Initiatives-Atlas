name: Roadmap board

# Keeps the public Project board (https://github.com/users/DaLuSt/projects/1) in
# step with the issues labelled `roadmap`: adds the ones that are missing, sets
# Status to Done when an issue closes, and gives each item Start/Target dates
# from its milestone so the board's Roadmap (timeline) layout can draw it.
# Rules and the exact behaviour: tools/project_board.py and docs/roadmap.md.
#
# Why a workflow: Projects v2 can only be changed through GitHub's GraphQL API,
# which the agent's own environment blocks. This runs on GitHub's side.
#
# One-time setup: add a repository secret named PROJECT_TOKEN, a classic
# personal access token with the `project` scope (a user-owned project cannot
# be edited with the built-in GITHUB_TOKEN or a fine-grained token). Until it
# exists the workflow does nothing and succeeds. Run it once by hand with
# "dry_run" ticked to read the log before letting it change anything.
#
# The token expires, and GitHub cannot say when, so two repository VARIABLES keep watch
# (docs/credentials.md, section 1; roadmap #496): PROJECT_TOKEN_EXPIRES (YYYY-MM-DD) makes
# the run warn 14 days ahead and fail once the date has passed; BOARD_SYNC_ENABLED=true
# (set it when the board works) makes a missing secret a failure instead of a quiet notice.
# A failing run, or a token near expiry, opens ONE issue, "Roadmap board sync needs
# attention"; the next healthy run closes it.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    # Mondays, 05:47 UTC: catches anything an event missed.
    - cron: "47 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the changes without making them"
        type: boolean
        default: true

permissions:
  contents: read
  issues: write   # only to open and close the one "needs attention" issue (see the last two steps)

# One run at a time; a run that is waiting is replaced by the newest one,
# which syncs everything anyway.
concurrency:
  group: project-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Check the secret
        id: secret
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Check the token's health
        id: health
        env:
          PRESENT: ${{ steps.secret.outputs.present }}
          EXPIRES: ${{ vars.PROJECT_TOKEN_EXPIRES }}
          ENABLED: ${{ vars.BOARD_SYNC_ENABLED }}
        run: python tools/board_health.py --secret-present "$PRESENT" --expires "$EXPIRES" --enabled "$ENABLED"

      - name: Sync the board
        if: steps.secret.outputs.present == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          python tools/project_board.py --owner DaLuSt --number 1 \
            --repo "$GITHUB_REPOSITORY" $flag

      - name: Open the "needs attention" issue
        if: failure() || steps.health.outputs.warn == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          MESSAGE: ${{ steps.health.outputs.message }}
        run: |
          title="Roadmap board sync needs attention"
          gh label create area:infra --color ededed 2>/dev/null || true
          existing=$(gh issue list --state open --limit 100 --json number,title \
                       --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            echo "Issue #$existing is already open; not adding to it."
            exit 0
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          {
            if [ -n "$MESSAGE" ]; then echo "$MESSAGE"; echo; fi
            echo "The roadmap board is kept current by the *Roadmap board* workflow. This run needs a person: $run_url"
            echo
            echo "Rotation steps, and what each repository variable does: \`docs/credentials.md\`, section 1. This issue closes by itself when a later run finishes without a problem and the token is not near expiry."
          } > body.md
          gh issue create --title "$title" --label area:infra --body-file body.md

      - name: Close the issue once the sync works again
        if: success() && steps.secret.outputs.present == 'true' && steps.health.outputs.warn != 'true' && inputs.dry_run != true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Roadmap board sync needs attention"
          existing=$(gh issue list --state open --limit 100 --json number,title \
                       --jq ".[] | select(.title == \"$title\") | .number" | head -1)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "A later run finished without a problem: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            gh issue close "$existing" --reason completed
          fi
