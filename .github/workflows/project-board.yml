name: Roadmap board

# Keeps the public Project board (https://github.com/users/DaLuSt/projects/1) in
# step with the issues labelled `roadmap`: adds the ones that are missing, sets
# Status to Done when an issue closes, and gives each item Start/Target dates
# from its milestone so the board's Roadmap (timeline) layout can draw it.
# Rules and the exact behaviour: tools/project_board.py and docs/roadmap.md.
#
# Why a workflow: Projects v2 can only be changed through GitHub's GraphQL API,
# which the agent's own environment blocks. This runs on GitHub's side.
#
# One-time setup: add a repository secret named PROJECT_TOKEN, a classic
# personal access token with the `project` scope (a user-owned project cannot
# be edited with the built-in GITHUB_TOKEN or a fine-grained token). Until it
# exists the workflow does nothing and succeeds. Run it once by hand with
# "dry_run" ticked to read the log before letting it change anything.
on:
  issues:
    types: [opened, reopened, closed, labeled, unlabeled, milestoned, demilestoned]
  schedule:
    # Mondays, 05:47 UTC: catches anything an event missed.
    - cron: "47 5 * * 1"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the changes without making them"
        type: boolean
        default: true

permissions:
  contents: read
  issues: read

# One run at a time; a run that is waiting is replaced by the newest one,
# which syncs everything anyway.
concurrency:
  group: project-board
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the secret
        id: secret
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
        run: |
          if [ -z "$PROJECT_TOKEN" ]; then
            echo "::notice::The PROJECT_TOKEN repository secret is not set, so the board was not touched. See docs/roadmap.md."
            echo "present=false" >> "$GITHUB_OUTPUT"
          else
            echo "present=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Sync the board
        if: steps.secret.outputs.present == 'true'
        env:
          PROJECT_TOKEN: ${{ secrets.PROJECT_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          flag=""
          if [ "$DRY_RUN" = "true" ]; then flag="--dry-run"; fi
          python tools/project_board.py --owner DaLuSt --number 1 \
            --repo "$GITHUB_REPOSITORY" $flag
